<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1916">
<title>Kazwini Design | استبيان المشروع</title>
<meta name="description" content="الاستبيان المشترك لمشاريع المطبخ والشقة من Kazwini Design">
<style>
:root{--ink:#1c1916;--panel:#29251f;--gold:#bd8752;--text:#f8f4ee;--muted:#cfc6bb;--line:#765f49}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--ink);color:var(--text)}
.portal{min-height:100vh;display:grid;place-items:center;padding:28px 20px 48px}
.box{width:min(650px,100%);text-align:center}
.logo{font:900 clamp(64px,18vw,96px)/1 Arial;color:var(--gold);letter-spacing:3px}
.name{font:800 clamp(31px,8vw,48px)/1.2 Arial;margin:18px 0 0}
.kicker{color:var(--gold);font-weight:700;letter-spacing:.7px;margin-top:8px}
.lead{color:var(--muted);font-size:clamp(17px,4.5vw,22px);line-height:1.8;margin:28px auto 34px;max-width:560px}
.choices{display:grid;gap:17px}
.choice{width:100%;border:2px solid var(--line);background:var(--panel);color:var(--text);border-radius:28px;padding:28px 20px;cursor:pointer;font-family:inherit;transition:.18s}
.choice:active{transform:scale(.985);border-color:var(--gold)}
.choice strong{display:block;font-size:clamp(23px,6vw,31px);margin-bottom:12px}
.choice span{display:block;color:var(--muted);font-size:16px;line-height:1.6}
.choice em{display:inline-block;color:var(--gold);font-style:normal;font:700 12px Arial;margin-top:12px;letter-spacing:1px}
.app{display:none;min-height:100vh;background:#f4f0ea}
.app.on{display:block}
.appbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#1c1916;color:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #493c30}
.appbar b{font:800 18px Arial}.appbar button{border:1px solid #765f49;border-radius:10px;background:#2b2722;color:#fff;padding:9px 13px;font-family:inherit;font-weight:bold}
iframe{display:block;width:100%;height:calc(100vh - 54px);border:0;background:#f4f0ea}
@media(min-width:700px){.choices{grid-template-columns:1fr 1fr}.choice{min-height:210px;display:grid;align-content:center}}
</style>
</head>
<body>
<main class="portal" id="portal">
  <section class="box">
    <div class="logo">KD</div>
    <h1 class="name">Kazwini Design</h1>
    <div class="kicker">استبيان المشروع المشترك</div>
    <p class="lead">اختر نوع المشروع، ثم أكمل الأسئلة المناسبة. تُحفظ النتيجة تلقائيًا داخل غرفة التحكم.</p>
    <div class="choices">
      <button class="choice" data-type="kitchen">
        <strong>تصميم المطبخ</strong>
        <span>التوزيع، الاستخدام، الأجهزة، التخزين والخامات</span>
        <em>KITCHEN BRIEF</em>
      </button>
      <button class="choice" data-type="home">
        <strong>تصميم الشقة</strong>
        <span>الفراغات، الأثاث، الألوان، الإضاءة والخدمات</span>
        <em>HOME BRIEF</em>
      </button>
    </div>
  </section>
</main>
<section class="app" id="app">
  <header class="appbar"><b id="title">KD</b><button id="close">تغيير نوع المشروع</button></header>
  <iframe id="survey" title="استبيان Kazwini Design" allow="camera; clipboard-write"></iframe>
</section>
<script>
const portal=document.getElementById('portal'),app=document.getElementById('app'),frame=document.getElementById('survey'),title=document.getElementById('title');
const types={kitchen:{src:'kitchen/',title:'استبيان تصميم المطبخ'},home:{src:'home/',title:'استبيان تصميم الشقة'}};
function openSurvey(type,push=true){const item=types[type];if(!item)return;title.textContent=item.title;frame.src=item.src;portal.style.display='none';app.classList.add('on');if(push)history.pushState({type},'', '?type='+type)}
function closeSurvey(push=true){frame.src='about:blank';app.classList.remove('on');portal.style.display='grid';if(push)history.pushState({},'',location.pathname)}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>openSurvey(b.dataset.type));
document.getElementById('close').onclick=()=>closeSurvey();
window.onpopstate=e=>e.state&&e.state.type?openSurvey(e.state.type,false):closeSurvey(false);
const initial=new URLSearchParams(location.search).get('type');if(types[initial])openSurvey(initial,false);
</script>
</body>
</html>
