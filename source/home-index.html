<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>استبيان تصميم الشقة | Kazwini Design</title>
<meta name="description" content="استبيان تفضيلات تصميم الصالون وفراغات الشقة من Kazwini Design">
<style>
:root{--ink:#171614;--muted:#746f67;--paper:#f4f0e8;--card:#fff;--line:#ded7cc;--accent:#171614;--soft:#e9e2d7;--ok:#2e6950}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.app{width:min(920px,100%);margin:auto;min-height:100vh;background:#faf8f4}.top{position:sticky;top:0;z-index:10;background:rgba(250,248,244,.96);backdrop-filter:blur(10px);padding:16px 20px 10px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:space-between}.logo b{font:900 33px/1 Arial}.logo span{display:block;font:12px/1.2 Arial;letter-spacing:3px}.stepno{font-size:14px;color:var(--muted)}.bar{height:4px;background:#e5dfd6;border-radius:9px;margin-top:13px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:.25s}.main{padding:28px 20px 116px}.page{display:none;animation:fade .25s ease}.page.active{display:block}@keyframes fade{from{opacity:.25;transform:translateY(5px)}}h1{font-size:30px;margin:0 0 10px;line-height:1.4}h2{font-size:25px;margin:0 0 8px;line-height:1.45}.lead{font-size:17px;line-height:1.8;color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.choice{position:relative;border:2px solid transparent;background:var(--card);border-radius:22px;padding:17px;cursor:pointer;box-shadow:0 2px 14px #2920160b;transition:.15s;min-height:87px;display:flex;gap:12px;align-items:center}.choice:hover{transform:translateY(-1px)}.choice.on{border-color:var(--ink);background:#f0ebe3}.choice .icon{font-size:27px;width:38px;text-align:center}.choice strong{font-size:17px;line-height:1.5}.choice small{display:block;color:var(--muted);font-size:13px;line-height:1.5;margin-top:3px}.imageChoice{padding:0;display:block;overflow:hidden}.imageChoice img{width:100%;aspect-ratio:1.1/1;object-fit:cover;display:block}.imageChoice .txt{padding:14px}.tick{display:none;position:absolute;top:10px;left:10px;background:#171614;color:#fff;width:27px;height:27px;border-radius:50%;place-items:center;font-weight:bold}.on .tick{display:grid}.note{margin:18px 0 0;padding:15px 17px;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:14px;line-height:1.7;background:#fff}.field{margin:0 0 16px}.field label{display:block;font-weight:bold;margin:0 0 8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 15px;font:16px Tahoma;color:var(--ink)}.field textarea{min-height:110px;resize:vertical}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(920px,100%);display:flex;gap:12px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:rgba(250,248,244,.97);border-top:1px solid var(--line);z-index:20}.btn{border:0;border-radius:17px;padding:15px 20px;font:700 17px Tahoma;cursor:pointer}.next{background:var(--ink);color:#fff;flex:1}.prev{background:var(--soft);color:var(--ink);min-width:100px}.summary{background:#fff;border-radius:22px;padding:20px;line-height:1.9;white-space:pre-wrap;border:1px solid var(--line);font-size:15px}.code{direction:ltr;text-align:center;background:#eee7dc;border-radius:14px;padding:14px;margin:16px 0;font:bold 15px monospace;overflow-wrap:anywhere}.actions{display:grid;gap:10px;margin-top:14px}.wa{background:#1f9d62;color:#fff}.copy{background:#e7e1d7}.hide{display:none!important}@media(max-width:560px){.main{padding:23px 14px 110px}.top{padding-inline:16px}.grid{gap:10px}.choice{border-radius:18px;padding:14px;min-height:82px}.imageChoice{padding:0}.imageChoice .txt{padding:12px}.choice strong{font-size:15px}h1{font-size:26px}h2{font-size:22px}.nav{padding-inline:14px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo"><b>KD</b><span>KAZWINI DESIGN</span></div><div class="stepno" id="stepNo"></div></div><div class="bar"><i id="progress"></i></div></header>
<main class="main" id="main"></main>
<nav class="nav" id="nav"><button class="btn prev" id="prev">السابق</button><button class="btn next" id="next">التالي</button></nav>
</div>
<script>
const rooms=[
['ENT','المدخل والممرات','🚪','الكونسول، المرايا والتخزين'],['LIV','الصالون والمعيشة','🛋️','الجلوس، التلفاز والاستقبال'],['DIN','غرفة الطعام','🍽️','السفرة وعلاقتها بالصالون'],['MBR','غرفة النوم الرئيسية','🛏️','السرير، التخزين والتسريحة'],['KID','غرف نوم الأطفال','🧸','النوم، الدراسة والتخزين'],['GST','غرفة ضيوف أو مكتب','🖥️','استخدام مرن أو مستقل'],['BTH','الحمامات','🛁','الخامات والتجهيزات والتخزين'],['DRS','غرفة الملابس','👔','التقسيمات وطريقة الإغلاق'],['BAL','البلكون أو التراس','🌿','الجلوس والنباتات والاستخدام'],['CEL','الأسقف والإضاءة العامة','💡','السقوف والسيناريوهات الضوئية']];
const data={};let pages=[],idx=0;
const q=(id,title,lead,opts,multi=false)=>({id,title,lead,opts,multi,type:'choice'});
const opt=(v,t,s='',icon='')=>({v,t,s,icon});
function basePages(){const selected=data.rooms||[],hasPublic=selected.some(x=>['ENT','LIV','DIN','GST','BAL','CEL'].includes(x));let a=[
{id:'intro',type:'intro'},
{id:'rooms',type:'rooms'},
q('status','ما حالة المشروع؟','اختر الحالة الأقرب للواقع',[opt('NEW','بناء جديد','الموقع قبل التشطيبات','🏗️'),opt('REN','تجديد كامل','إعادة تصميم وتشطيب','🔨'),opt('PART','تعديل جزئي','تطوير فراغات محددة','🧱'),opt('FURN','تأثيث وديكور','دون تغيير إنشائي كبير','🪑')]),
q('available','معلومات الموقع','حدد كل ما هو متوفر حالياً. إذا لم تتوفر لديك قياسات أو صور سنرتب معك معاينة للموقع.',[opt('MEAS','قياسات دقيقة للشقة','', '📏'),opt('PLAN','مخطط معماري','', '📐'),opt('PHO','صور الموقع','', '📷'),opt('FIX','مواقع الخدمات ثابتة','', '⌖'),opt('ELE','مخطط كهرباء','', '⚡'),opt('VISIT','أحتاج إلى معاينة الموقع','سنقوم بالقياس والتصوير وتسجيل التفاصيل', '◉')],true),
q('users','من سيستخدم الشقة؟','يساعدنا ذلك في التوزيع واختيار المتانة',[opt('COUPLE','زوجان','', '◉'),opt('FAMILY','عائلة مع أطفال','', '👨‍👩‍👧‍👦'),opt('SINGLE','شخص واحد','', '●'),opt('GUESTS','استقبال وضيوف بكثرة','', '☕')],true)];
if(hasPublic)a.push({id:'style',type:'images',title:'أي اتجاه تصميمي يشبهك أكثر؟',lead:'اختر الصورة بحسب الجو والتكوين، وليس اللون وحده',prefix:'living',opts:[opt('MOD','مودرن معاصر'),opt('MCL','مودرن كلاسيك'),opt('MIN','بسيط وهادئ'),opt('LUX','فخم وأنيق')]});
a.push({id:'mood',type:'images',multi:true,title:'ما الجو اللوني الأقرب لك؟',lead:'يمكن الجمع بين اتجاهين',prefix:'mood',opts:[opt('LIGHT','فاتح ومحايد','أوف وايت، بيج وغريج'),opt('WARM','دافئ وطبيعي','خشب وألوان ترابية'),opt('CONTRAST','متباين','فاتح مع داكن واضح'),opt('DARK','داكن وفخم','بني، رمادي وفحمي')]},q('materials','ما الخامات التي تحب حضورها؟','اختر ما يجذبك بصرياً',[opt('WOOD','خشب بعروق طبيعية','', '▥'),opt('STONE','رخام أو حجر','', '▦'),opt('FABRIC','أقمشة ناعمة','', '▧'),opt('METAL','معدن وزجاج','', '◇'),opt('PLAIN','أسطح سادة هادئة','', '□')],true));return a}
function roomPages(){let a=[];const has=x=>(data.rooms||[]).includes(x);
if(has('ENT'))a.push(q('ent','ماذا تحتاج في المدخل؟','اختر العناصر المهمة',[opt('CONSOLE','كونسول ومرآة'),opt('SHOE','خزانة أحذية'),opt('SEAT','مقعد صغير'),opt('FEATURE','جدار مميز')],true));
if(has('LIV'))a.push(q('livingUse','كيف تستخدم الصالون والمعيشة؟','يمكن اختيار أكثر من استخدام',[opt('DAILY','معيشة يومية'),opt('FORMAL','استقبال رسمي'),opt('TV','مشاهدة التلفاز'),opt('GATHER','جلسات عائلية كبيرة')],true),q('livingNeeds','ما العناصر الأساسية؟','',[opt('TVW','جدار تلفاز'),opt('LIB','مكتبة أو تخزين'),opt('FIRE','مدفأة'),opt('OPEN','مساحة مفتوحة وخفيفة')],true));
if(has('DIN'))a.push(q('dining','كيف تفضّل منطقة الطعام؟','',[opt('4','طاولة 4 أشخاص'),opt('6','طاولة 6 أشخاص'),opt('8','طاولة 8 أشخاص أو أكثر'),opt('OPEN','مدمجة مع الصالون'),opt('SEP','فراغ مستقل')],true));
if(['MBR','KID','DRS'].some(has))a.push({id:'bedstyle',type:'images',title:'أي جو تفضّله لغرف النوم؟',lead:'اختر التكوين الأقرب لراحتك',prefix:'bedroom',opts:[opt('MOD','مودرن معاصر'),opt('MCL','مودرن كلاسيك'),opt('MIN','دافئ وبسيط'),opt('LUX','فخم كالفنادق')]});
if(has('MBR'))a.push(q('master','ما احتياجات الغرفة الرئيسية؟','',[opt('KING','سرير King'),opt('WARD','خزائن داخل الغرفة'),opt('VAN','تسريحة'),opt('TV','تلفاز'),opt('READ','ركن قراءة أو جلوس')],true));
if(has('KID'))a.push(q('kids','ما المطلوب في غرف الأطفال؟','',[opt('ONE','سرير مفرد'),opt('TWO','سريران'),opt('BUNK','سرير طابقين'),opt('DESK','مكتب دراسة'),opt('PLAY','مساحة لعب'),opt('STORE','تخزين كبير')],true));
if(has('GST'))a.push(q('guest','ما استخدام الفراغ الإضافي؟','',[opt('GUEST','غرفة ضيوف'),opt('OFFICE','مكتب منزلي'),opt('BOTH','غرفة مرنة للاثنين'),opt('HOBBY','هواية أو قراءة')]));
if(has('BTH'))a.push({id:'bathstyle',type:'images',title:'أي جو تفضّله للحمامات؟',lead:'ركز على الخامة العامة ودرجة الإضاءة',prefix:'bathroom',opts:[opt('WARM','حجر فاتح وخشب'),opt('GREY','رمادي معاصر'),opt('DARK','رخام داكن وفخم'),opt('SPA','هادئ بطابع Spa')]},q('bath','ما التجهيزات المطلوبة؟','يمكن اختيار أكثر من عنصر',[opt('SHOWER','دش زجاجي'),opt('TUB','بانيو'),opt('DOUBLE','مغسلة مزدوجة'),opt('STORE','خزانة وتخزين'),opt('NICHE','فتحات Niche'),opt('HIDDEN','سيفون مخفي')],true));
if(has('DRS'))a.push(q('dressing','كيف تفضّل غرفة الملابس؟','',[opt('CLOSED','خزائن مغلقة'),opt('GLASS','واجهات زجاج'),opt('OPEN','خزائن مفتوحة'),opt('MIX','مزيج مفتوح ومغلق')],true));
if(has('BAL'))a.push(q('balcony','كيف تريد استخدام البلكون أو التراس؟','',[opt('SEAT','جلسة يومية'),opt('DIN','طاولة طعام'),opt('GREEN','نباتات كثيفة'),opt('SERVICE','استخدام عملي وخدمة')],true));
if(has('CEL'))a.push(q('ceiling','ما أسلوب السقف والإضاءة؟','',[opt('SIMPLE','سقف بسيط'),opt('HIDDEN','إضاءة مخفية'),opt('TRACK','Track Lights'),opt('DECOR','تفاصيل ديكورية'),opt('SCENES','عدة سيناريوهات إضاءة')],true));return a}
function endPages(){return[
q('lighting','ما أجواء الإضاءة المفضلة؟','',[opt('WARM','دافئة 3000K'),opt('BAL','متوازنة 3500K'),opt('NAT','طبيعية 4000K'),opt('MIX','عدة سيناريوهات')]),
q('scope','ما الخدمة المطلوبة؟','',[opt('DES','تصميم 3D فقط'),opt('DRAW','تصميم ومخططات تنفيذية'),opt('SUP','تصميم ومتابعة'),opt('FULL','تصميم وتنفيذ كامل')]),
q('priority','ما الأولوية الأهم؟','',[opt('LOOK','الجمال والانطباع'),opt('FUNC','العملية والاستخدام'),opt('STORE','التخزين'),opt('BUD','ضبط الميزانية'),opt('BAL','توازن بين الجميع')]),
{id:'details',type:'details'}, {id:'result',type:'result'}]}
function rebuild(){const current=pages[idx]?.id;pages=[...basePages(),...roomPages(),...endPages()];let n=pages.findIndex(x=>x.id===current);if(n>=0)idx=n;render()}
const main=document.getElementById('main'),prev=document.getElementById('prev'),next=document.getElementById('next');
function render(){let p=pages[idx];document.getElementById('stepNo').textContent=`${idx+1} من ${pages.length}`;document.getElementById('progress').style.width=`${(idx+1)/pages.length*100}%`;prev.style.visibility=idx?'visible':'hidden';next.textContent=p.type==='result'?'ابدأ من جديد':'التالي';main.innerHTML='';let el=document.createElement('section');el.className='page active';
if(p.type==='intro')el.innerHTML=`<h1>لنحدد معاً هوية شقتك</h1><p class="lead">اختر الفراغات التي يشملها مشروعك، ثم أجب عن الأسئلة التي تظهر لك. يمكنك تعديل اختياراتك قبل إرسال النتيجة.</p><div class="note"><b>ملاحظة:</b> للمطبخ استبيان مستقل ومتكامل، لذلك لا يظهر ضمن هذا النموذج.</div>`;
else if(p.type==='rooms'){el.innerHTML=`<h2>ما الفراغات المشمولة بالمشروع؟</h2><p class="lead">اختر فراغاً واحداً أو أكثر</p><div class="grid" id="choices"></div><div class="note" id="all">اختيار الشقة كاملة</div>`;const g=el.querySelector('#choices');rooms.forEach(r=>g.append(card({v:r[0],t:r[1],s:r[3],icon:r[2]},'rooms',true)));let all=el.querySelector('#all');all.style.cursor='pointer';all.onclick=()=>{data.rooms=rooms.map(r=>r[0]);rebuild()}}
else if(p.type==='images'){el.innerHTML=`<h2>${p.title}</h2><p class="lead">${p.lead}</p><div class="grid" id="choices"></div>`;p.opts.forEach((o,i)=>{o.img=`assets/${p.prefix}-${i}.png`;el.querySelector('#choices').append(card(o,p.id,!!p.multi,true))})}
else if(p.type==='choice'){el.innerHTML=`<h2>${p.title}</h2><p class="lead">${p.lead||''}</p><div class="grid" id="choices"></div>`;p.opts.forEach(o=>el.querySelector('#choices').append(card(o,p.id,p.multi)))}
else if(p.type==='details')el.innerHTML=`<h2>معلومات أخيرة عن المشروع</h2><p class="lead">تساعدنا هذه المعلومات على ترتيب الخطوة التالية</p><div class="field"><label>اسم العميل</label><input id="name" value="${data.name||''}" placeholder="الاسم"></div><div class="field"><label>رقم الهاتف</label><input id="phone" type="tel" value="${data.phone||''}" placeholder="رقم الهاتف"></div><div class="field"><label>اسم المشروع</label><input id="projectName" value="${data.projectName||''}" placeholder="مثال: منزل العائلة"></div><div class="field"><label>المدينة أو موقع المشروع</label><input id="location" value="${data.location||''}" placeholder="مثال: دمشق، بيروت..."></div><div class="field"><label>الميزانية التقريبية</label><select id="budget"><option value="">غير محددة بعد</option><option>اقتصادية</option><option>متوسطة</option><option>مرنة حسب التصميم</option><option>مفتوحة لجودة أعلى</option></select></div><div class="field"><label>الموعد المطلوب</label><input id="date" value="${data.date||''}" placeholder="مثال: خلال شهرين"></div><div class="field"><label>ملاحظات أو احتياجات خاصة</label><textarea id="notes" placeholder="أي تفاصيل مهمة...">${data.notes||''}</textarea></div>`;
else if(p.type==='result'){const text=summary(),message=text+'\n\nكود المشروع: '+code(),waUrl='https://api.whatsapp.com/send?text='+encodeURIComponent(message);el.innerHTML=`<h2>ملخص توجه مشروعك</h2><p class="lead">راجع النتيجة ثم أرسلها إلى Kazwini Design</p><div class="summary">${esc(text)}</div><div class="code">${code()}</div><div class="actions"><a class="btn wa" id="wa" href="${waUrl}" target="_blank" rel="noopener noreferrer external">فتح واتساب وإرسال النتيجة</a><button class="btn copy" id="copy">نسخ النتيجة</button></div><div class="note">إذا لم يفتح تطبيق واتساب تلقائياً، اضغط «نسخ النتيجة» ثم الصقها في المحادثة.</div>`;el.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(message);el.querySelector('#copy').textContent='تم النسخ ✓'}}
main.append(el);if(p.type==='result'){next.classList.remove('hide');sendToControlRoom()}window.scrollTo({top:0,behavior:'smooth'})}
function card(o,key,multi,img=false){let d=document.createElement('div');d.className='choice'+(img?' imageChoice':'');let selected=multi?(data[key]||[]).includes(o.v):data[key]===o.v;if(selected)d.classList.add('on');d.innerHTML=`<span class="tick">✓</span>${img?`<img src="${o.img}" alt="${o.t}"><div class="txt"><strong>${o.t}</strong>${o.s?`<small>${o.s}</small>`:''}</div>`:`<div class="icon">${o.icon||'○'}</div><div><strong>${o.t}</strong>${o.s?`<small>${o.s}</small>`:''}</div>`}`;d.onclick=()=>{if(multi){let a=data[key]||[];data[key]=a.includes(o.v)?a.filter(x=>x!==o.v):[...a,o.v]}else data[key]=o.v;if(key==='rooms')rebuild();else render()};return d}
function saveDetails(){data.name=document.querySelector('#name').value;data.phone=document.querySelector('#phone').value;data.projectName=document.querySelector('#projectName').value;data.location=document.querySelector('#location').value;data.budget=document.querySelector('#budget').value;data.date=document.querySelector('#date').value;data.notes=document.querySelector('#notes').value}
function valid(p){if(['intro','result','details'].includes(p.type))return true;if(p.id==='rooms')return data.rooms?.length;return p.multi?data[p.id]?.length:data[p.id]}
next.onclick=()=>{if(pages[idx].type==='result'){data.rooms=[];idx=0;rebuild();return}if(pages[idx].type==='details')saveDetails();if(!valid(pages[idx])){alert('يرجى اختيار إجابة للمتابعة');return}idx++;render()};prev.onclick=()=>{if(pages[idx].type==='details')saveDetails();idx--;render()};
function label(key,val){let p=pages.find(x=>x.id===key);if(key==='rooms')return rooms.filter(r=>val.includes(r[0])).map(r=>r[1]).join('، ');if(!p?.opts)return val;let vals=Array.isArray(val)?val:[val];return vals.map(v=>p.opts.find(o=>o.v===v)?.t||v).join('، ')}
function summary(){let order=[['rooms','الفراغات'],['status','حالة المشروع'],['available','المتوفر من الموقع'],['users','الاستخدام'],['style','الاتجاه العام'],['mood','الجو اللوني'],['materials','الخامات'],['ent','المدخل'],['livingUse','استخدام الصالون'],['livingNeeds','عناصر الصالون'],['dining','منطقة الطعام'],['bedstyle','جو غرفة النوم'],['master','الغرفة الرئيسية'],['kids','غرف الأطفال'],['guest','الفراغ الإضافي'],['bathstyle','جو الحمامات'],['bath','تجهيزات الحمامات'],['dressing','غرفة الملابس'],['balcony','البلكون'],['ceiling','الأسقف'],['lighting','الإضاءة'],['scope','الخدمة'],['priority','الأولوية']];let s='ملخص استبيان شقة Kazwini Design\n';if(data.name)s+='\nالعميل: '+data.name;if(data.location)s+='\nالموقع: '+data.location;order.forEach(([k,t])=>{if(data[k])s+=`\n${t}: ${label(k,data[k])}`});s+=`\nالميزانية: ${data.budget||'غير محددة بعد'}\nالموعد: ${data.date||'غير محدد'}`;if(data.notes)s+='\nملاحظات: '+data.notes;return s}
